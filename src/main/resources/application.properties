server.port=8082
spring.application.name=msvc-category

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_category
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

#Configuracion Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
#Solución problema de nombre DNS para local host
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=msvc-categories

#Configuracion de imagenes
#Almacenamiento de imagenes
app.upload.dir=C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/categories/
spring.web.resources.static-locations=file:/C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#Configuracion Logging
logging.level.root=INFO
logging.level.com.ecommerce.category=DEBUG
logging.file.name=C:/Ambiente/Spring/myWorkspace/ecommerce-local/logs/category-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Mínimo necesario para ver consultas JPA
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Opcional: para ver más detalles
logging.level.org.springframework.data.jpa.repository.query=DEBUG