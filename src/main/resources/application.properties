server.port=8082
spring.application.name=msvc-category

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_local
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.show-sql=true

#Configuracion Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.instance.hostname=msvc-category
eureka.instance.instance-id=${spring.application.name}:${server.port}

#Configuracion de imagenes
#Almacenamiento de imagenes
app.upload.dir=C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/categories/
spring.web.resources.static-locations=file:/C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#Configuracion Logging
logging.level.root=INFO
logging.level.com.ecommerce.category=DEBUG
logging.file.path=C:/Ambiente/Spring/myWorkspace/ecommerce-local
logging.file.name=C:/Ambiente/Spring/myWorkspace/ecommerce-local/logs/category-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Para borrar el log al iniciar (Spring Boot 2.4+)
logging.logback.rollingpolicy.clean-history-on-start=true
# Desactivar buffering
logging.logback.rollingpolicy.immediate-flush=true

# Mínimo necesario para ver consultas JPA
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Opcional: para ver más detalles
logging.level.org.springframework.data.jpa.repository.query=DEBUG

# Kafka Producer Config
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.topic=category-events

# Kafka Consumer Config
#spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.consumer.group-id=category-service-group
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.product.events

# Kafka Consumer Config
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=category-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Topic configuration (AÑADE ESTA LÍNEA)
app.kafka.topics.product-category-events=product-category-events

# Configuración crítica para el módulo compartido
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.shared.events
spring.kafka.consumer.properties.spring.json.type.mapping=productCategoryEvent:com.ecommerce.shared.events.ProductCategoryEvent

# Configuración del listener
spring.kafka.listener.ack-mode=BATCH
spring.kafka.listener.missing-topics-fatal=false

# Opcional: Configuración de reintentos
spring.kafka.listener.retry.initial-interval=1000
spring.kafka.listener.retry.max-attempts=3
spring.kafka.listener.retry.multiplier=2.0

